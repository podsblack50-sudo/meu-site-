<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMOKEPODS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f8ff;
      color: #111827;
    }

    header {
      background: linear-gradient(135deg, #0757d5, #168cff);
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    header p {
      font-size: 16px;
    }

    .banner {
      text-align: center;
      padding: 25px 15px 10px;
    }

    .banner h2 {
      color: #0757d5;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .banner p {
      color: #555;
    }

    .produto {
      max-width: 420px;
      margin: 25px auto;
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .produto img {
      width: 100%;
      height: 330px;
      object-fit: contain;
      border-radius: 15px;
      background: #f5f7fb;
    }

    .produto h3 {
      font-size: 23px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .descricao {
      color: #666;
      margin-bottom: 15px;
    }

    .preco {
      font-size: 30px;
      font-weight: bold;
      color: #0757d5;
      margin-bottom: 18px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 15px;
      background: #0757d5;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .botao:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SMOKEPODS</h1>
    <p>Fones personalizados do seu jeito 🎧</p>
  </header>

  <section class="banner">
    <h2>Escolha o seu favorito</h2>
    <p>Qualidade, estilo e personalidade em um só produto.</p>
  </section>

  <main>

    <div class="produto">

      <img src="8cbeb1d1-5c12-4b4c-ae4a-dbf56ee776cb.jpeg"
           alt="Fone personalizado">

      <h3>Fone Personalizado</h3>

      <p class="descricao">
        Fone personalizado com estilo exclusivo.
      </p>

      <div class="preco">R$ 69,99</div>

      <a class="botao"
         href="https://wa.me/5500000000000?text=Olá!%20Quero%20comprar%20o%20Fone%20Personalizado%20por%20R$%2069,99."
         target="_blank">
        COMPRAR AGORA
      </a>

    </div>

  </main>

  <footer>
    © 2026 SMOKEPODS — Todos os direitos reservados.
  </footer>

</body>
</html>
