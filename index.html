<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUA LOJA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #111827;
    }

    header {
      background: #0757d5;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .banner {
      background: linear-gradient(135deg, #0757d5, #1683ff);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .banner h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .banner p {
      font-size: 17px;
      margin-bottom: 25px;
    }

    .botao {
      display: inline-block;
      background: white;
      color: #0757d5;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .produtos {
      padding: 35px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .produtos h2 {
      text-align: center;
      color: #0757d5;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .produto {
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .produto img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      background: #e5edff;
    }

    .produto h3 {
      margin: 15px 0 8px;
    }

    .preco {
      color: #0757d5;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .comprar {
      display: block;
      background: #0757d5;
      color: white;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #061b3a;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SUA LOJA</h1>
    <p>Qualidade, estilo e confiança</p>
  </header>

  <section class="banner">
    <h2>Bem-vindo à nossa loja!</h2>
    <p>Confira nossos produtos e aproveite.</p>
    <a href="#produtos" class="botao">Ver produtos</a>
  </section>

  <section class="produtos" id="produtos">
    <h2>🔥 Nossos produtos</h2>

    <div class="grid">

      <div class="produto">
        <img src="https://via.placeholder.com/500x500.png?text=Produto+1">
        <h3>Produto 1</h3>
        <div class="preco">R$ 99,90</div>
        <a href="#" class="comprar">Comprar</a>
      </div>

      <div class="produto">
        <img src="https://via.placeholder.com/500x500.png?text=Produto+2">
        <h3>Produto 2</h3>
        <div class="preco">R$ 149,90</div>
        <a href="#" class="comprar">Comprar</a>
      </div>

      <div class="produto">
        <img src="https://via.placeholder.com/500x500.png?text=Produto+3">
        <h3>Produto 3</h3>
        <div class="preco">R$ 199,90</div>
        <a href="#" class="comprar">Comprar</a>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 SUA LOJA</p>
    <p>Todos os direitos reservados.</p>
  </footer>

</body>
</html>
